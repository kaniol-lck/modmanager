name: CI
on:
  push:
    paths:
      - "*.pro"
      - "package/**"
      - "src/**"
      - "Changelog.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "*.pro"
      - "package/**"
      - "src/**"
      - "Changelog.md"
      - ".github/workflows/ci.yml"
jobs:
  create-release:
    # 必须显式限定 push：pull_request 事件里没有 github.event.ref，
    # 它取空串 ⇒ !startsWith('', 'refs/tags/') 恒为真 ⇒ PR 也会走到这里建 pre-release。
    if: ${{ github.event_name == 'push' && !startsWith(github.event.ref, 'refs/tags/') }}
    name: Create Pre-Release
    runs-on: ubuntu-latest
    needs:
      - build-on-ubuntu
      - build-on-win-mingw
      - build-on-osx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set Env
        shell: bash
        run: |
          export VERSION=$(grep -o '".*"' src/version.h | sed 's/"//g')-build.$GITHUB_RUN_NUMBER
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Get short commit sha
        id: get_short_sha
        run: |
          # ::set-output 已被弃用，改用 $GITHUB_OUTPUT
          echo "short_sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Create Github pre-release
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ env.VERSION }}"
          prerelease: true
          title: "Mod Manager Dev ${{ env.VERSION }} (${{ steps.get_short_sha.outputs.short_sha }})"
          files: |
            artifacts/**
  build-on-ubuntu:
    name: Build On Ubuntu
    # 留在 24.04 是因为 install-qt-action 的官方 Qt 6.7.2 与这个镜像的组合已验证过，
    # 不是为了 libquazip1-qt6-dev —— 那个包已经不用了（见 Build QuaZip 那步）。
    runs-on: ubuntu-24.04
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 与 Windows job 对齐。以前是 5.15.2 —— Qt5 已停止开源支持，
          # 且代码里 3 处 Qt5/Qt6 条件编译里两处在 #ifdef Q_OS_WIN 内、
          # 第三处（localmoditemwidget 的 QEnterEvent）本就是 Qt6 分支，
          # 所以 Linux 走 Qt6 不引入任何新代码路径。
          version: 6.7.2
          # 不再装 qtwebengine：代码里只有 websiteicon.cpp 的注释残留，
          # 没有任何实际引用，而它是这个 job 里最大的一块下载。
          # （install-qt-action 的 modules 为空即不装额外模块，无需写 modules: ''）
      - name: ubuntu install packages
        run: |
          sudo apt update
          sudo apt-get install -y libglew-dev libglfw3-dev
          # 不再装 libquazip1-qt6-dev：它 Depends: qt6-base-dev + libqt6core5compat6-dev，
          # 会把 Ubuntu 自带的 Qt 6.4.2 头文件和 Qt5Compat 一起拖进来（详见下一步）。
          # 改成自建 quazip，只需要 zlib 的开发头文件。
          sudo apt-get install -y libaria2-0-dev zlib1g-dev
          # libxcb-cursor0 是 Qt 6.5+ 的 xcb 平台插件硬依赖，缺了 AppImage 打出来在用户机上起不来
          sudo apt install -y libgl-dev libx11-dev libxkbcommon-x11-dev libxcb-util1 libxcb-cursor0 libxcb-image0-dev libxcb-icccm4-dev libssl-dev libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
          sudo apt install -y libprotobuf-dev protobuf-compiler protobuf-c-compiler libgrpc++-dev protobuf-compiler-grpc ninja-build fcitx5-frontend-qt6 libcurl4-openssl-dev
      - name: Build QuaZip（与官方 Qt 同 ABI，且关掉 QTextCodec）
        run: |
          set -e
          # 原本想直接用 Ubuntu 的 libquazip1-qt6-dev，run #662/#663 连着翻两次车说明不行：
          #  ① 它的 .pc 写着 "Requires: zlib, Qt6Core"，而它 Depends: qt6-base-dev
          #     ⇒ pkg-config --cflags 会展开出 -I/usr/include/x86_64-linux-gnu/qt6/...
          #     而 qmake 把 QMAKE_CXXFLAGS 排在 INCPATH **之前** ⇒ 拿 Ubuntu 的 Qt 6.4.2
          #     头文件去编、却链官方 Qt 6.7.2 的库。（#662 的症状就是这个，注解只有 exit 2）
          #  ② 它是带 QUAZIP_ENABLE_QTEXTCODEC=ON 编的，quazip_qt_compat.h 第 18 行有
          #     #include <QtCore5Compat/QTextCodec>，于是反过来要求官方 Qt 装 qt5compat。
          #     #663 加上 ::error:: 自曝后拿到的原文：
          #       fatal error: QtCore5Compat/QTextCodec: No such file or directory
          # 自建一份并把 QTEXTCODEC 关掉，两条一起消失；而且与 Win/macOS 用同一套配方，
          # 三个平台的 quazip 从此同版本（1.7.2）同 ABI。
          curl -L -o quazip.tar.gz https://github.com/stachenov/quazip/archive/refs/tags/v1.7.2.tar.gz
          tar -xf quazip.tar.gz
          cmake -S quazip-1.7.2 -B quazip-build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DQUAZIP_QT_MAJOR_VERSION=6 \
                -DQUAZIP_ENABLE_QTEXTCODEC=OFF \
                -DQUAZIP_ENABLE_TESTS=OFF \
                -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build quazip-build --parallel 3
          sudo cmake --install quazip-build
          # Qt 官方包不带 Qt6Core.pc，pkg-config 解析不了 "Requires: zlib, Qt6Core"
          # （Qt 的 include/lib 本来就由 qmake 提供），去掉它 —— 与 Windows 那步一致。
          PC=/usr/local/lib/pkgconfig/quazip1-qt6.pc
          [ -f "$PC" ] || { echo "::error::cmake install 没有生成 $PC"; exit 1; }
          sudo sed -i 's/, Qt6Core//' "$PC"
          grep -E '^Requires:' "$PC"
          if grep -q 'Qt6Core' "$PC"; then echo "::error::$PC 的 Requires 里仍有 Qt6Core"; exit 1; fi
          # 让 ldd 能解析到新装的 .so —— 后面 appimagetool -s deploy 全靠 ldd 收集依赖
          sudo ldconfig
          ls -l /usr/local/lib/libquazip1-qt6*
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set Env
        run: |
          export ARCH=x86_64
          export RAW_VERSION=$(grep -o '".*"' src/version.h | sed 's/"//g')
          export VERSION=$RAW_VERSION-build.$GITHUB_RUN_NUMBER
          # 这里必须用 RAW_VERSION：上面的 VERSION 带 -build.<run_number> 后缀，
          # 而 Changelog 的小节标题只有 vX.Y.Z，用 VERSION 永远匹配不到，
          # RELEASE_TEXT 恒为空 ⇒ release 说明一直是一张白纸。
          export RELEASE_TEXT=$(grep -Pzo "### ${RAW_VERSION}\n(\n|.)+?\n##" Changelog.md | sed '$ d')
          echo "RAW_VERSION=${RAW_VERSION}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TEXT<<EOF" >> $GITHUB_ENV
          echo "${RELEASE_TEXT}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Modify version number
        if: ${{ !startsWith(github.event.ref, 'refs/tags/') }}
        shell: bash
        run: |
          sed -i "s/$RAW_VERSION/$VERSION/" src/version.h
      - name: build ubuntu
        run: |
          # bash 在这个 runner 上默认带 -e，失败会中断；但注解里只会留一句 exit code，
          # 而 job 日志正文经 API 需要 admin 权限（匿名 403）。所以这里显式把失败输出
          # 摘成 ::error:: 注解 —— 与 Windows 各步一致，下次翻车不用凭据就能定位。
          # 自建的那份 quazip 装在 /usr/local，所以要把它的 pkgconfig 目录带上
          export PKG_CONFIG_PATH='/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig/'
          # 先显式验证 pkg-config：它在 .pro 里是被 $$system() 调用的，失败只会静默返回空串，
          # 症状会伪装成 "quazip.h: No such file or directory" 这种编译错误。
          if ! pkg-config --modversion libaria2 quazip1-qt6; then
            echo "::error::pkg-config 解析不到 libaria2 / quazip1-qt6"
            exit 1
          fi
          # cflags 必须给出 quazip 的 include，且不得混进任何系统 Qt6 的 include ——
          # 后者会盖过官方 Qt 6.7.2 的头文件（run #662 就是这么翻的）。
          CF="$(pkg-config --cflags libaria2 quazip1-qt6)"
          echo "cflags = $CF"
          case "$CF" in
            *QuaZip-Qt6-*) : ;;
            *) echo "::error::cflags 里没有 quazip 的 include 路径：$CF"; exit 1 ;;
          esac
          case "$CF" in
            *x86_64-linux-gnu/qt6*) echo "::error::cflags 里混进了系统 Qt 的 include：$CF"; exit 1 ;;
          esac
          set +e
          qmake > qmake.log 2>&1; QM=$?
          make    > make.log  2>&1; MK=$?
          set -e
          if [ "$QM" -ne 0 ]; then
            cat qmake.log
            grep -aE 'error|Cannot find' qmake.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::qmake 失败（exit=$QM）"
            exit 1
          fi
          if [ "$MK" -ne 0 ]; then
            cat make.log
            grep -aE 'error:|Error [0-9]+|undefined reference|No such file' make.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::make 失败（exit=$MK）"
            exit 1
          fi
          tail -3 make.log
      - name: package
        run: |
          make INSTALL_ROOT=AppDir -j2 install ; find AppDir/
          wget -c -nv https://github.com/$(wget -q https://github.com/probonopd/go-appimage/releases/expanded_assets/continuous -O - | grep "appimagetool-.*-x86_64.AppImage" | head -n 1 | cut -d '"' -f 2) #Thanks to github page change.
          chmod +x appimagetool-*.AppImage
          sudo mkdir -p /home/qt/work/install
          sudo ln -s $QT_PLUGIN_PATH /home/qt/work/install/plugins
          ./appimagetool-*.AppImage -s deploy AppDir/usr/share/applications/*.desktop
          ./appimagetool-*.AppImage AppDir
      - uses: actions/upload-artifact@v4
        with:
          name: ModManager-${{ env.VERSION }}-x86_64.AppImage
          path: Mod_Manager*.AppImage
      - name: uploadRelease
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Mod_Manager-${{ env.VERSION }}-x86_64.AppImage
          asset_name: ModManager-${{ env.VERSION }}-x86_64.AppImage
          tag: ${{ github.ref }}
          body: ${{ env.RELEASE_TEXT }}
          overwrite: true
  build-on-win-mingw:
    name: Build On Windows Mingw
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_arch: win64_mingw
            qt_ver: 6.7.2
            # 必须显式装工具链：install-qt-action v4 不会为 mingw 架构自动装编译器，
            # 而 runner 镜像里既没有 Qt 也没有 MinGW（MSYS2 只是预装但不在 PATH）。
            # qt.tools.win64_mingw900 就是 Qt 6.7.x 官方配套的 MinGW（实测装的 7z 是
            # mingw-w64-x86_64-11.2.0-...，展开到 Qt/Tools/mingw1120_64）。
            qt_tools: 'tools_mingw90,qt.tools.win64_mingw900'
            # quazip 不再从 MSYS2 装（见 Build QuaZip 那步的说明），所以不需要 qt5compat
            modules:
          # Qt5 分支已不可行：MSYS2 把 quazip 合并成了 Qt6 单包
          # （mingw-w64-x86_64-quazip → Provides/Conflicts: ...-quazip-qt6，
          #   只出 libquazip1-qt6.dll 和 quazip1-qt6.pc），Qt5 在 Windows 上拿不到 quazip。
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          host: 'windows'
          target: 'desktop'
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}
          modules: ${{ matrix.modules }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set Env
        shell: bash
        run: |
          export RAW_VERSION=$(grep -o '".*"' src/version.h | sed 's/"//g')
          export VERSION=$RAW_VERSION-build.$GITHUB_RUN_NUMBER
          echo "RAW_VERSION=${RAW_VERSION}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Modify version number
        if: ${{ !startsWith(github.event.ref, 'refs/tags/') }}
        shell: bash
        run: |
          sed -i "s/$RAW_VERSION/$VERSION/" src/version.h
      - name: Install dependencies（MSYS2 提供 libaria2 与 pkg-config；zlib 由 aria2 的依赖带入）
        shell: powershell
        run: |
          C:/msys64/usr/bin/pacman -S mingw-w64-x86_64-aria2 --noconfirm
          C:/msys64/usr/bin/pacman -S mingw-w64-x86_64-pkg-config --noconfirm
          C:/msys64/usr/bin/pacman -Q
      - name: Install NSIS（windows-2025 镜像不再预装）
        shell: pwsh
        run: |
          trap { Write-Output "::error::$($_.Exception.Message)"; exit 1 }
          # 为什么需要这一步：`windows-latest` 正在迁到 windows-2025 镜像，而
          #   windows-2022 的软件清单里有 NSIS 3.10、windows-2025 里**没有**
          #   （只剩 InnoSetup 6.7.1 / WiX 3.14.1）。
          # 于是 `makensis` 不在 PATH 上 → run #660 的注解原话：
          #   "The term 'makensis' is not recognized as a name of a cmdlet, ..."。
          # 这个故障以前被前面步骤的失败掩盖着（#658 死在 Build QuaZip、
          # #659 死在收集 DLL），直到那两处修好、这一步第一次真正跑到才暴露。
          # Chocolatey 2.7.4 是镜像自带的，用它装。
          $choco = (Get-Command choco -ErrorAction SilentlyContinue).Source
          if (-not $choco) { $choco = 'C:\ProgramData\chocolatey\bin\choco.exe' }
          if (-not (Test-Path $choco)) { throw 'runner 上找不到 choco（Chocolatey 不是镜像自带的吗？）' }
          & $choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install nsis 失败（exit=$LASTEXITCODE）" }
          # 装到哪了不写死：x86 与 x64 两个 Program Files 都试一遍
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) { $nsis = Join-Path $env:ProgramFiles 'NSIS' }
          $mk = Join-Path $nsis 'makensis.exe'
          if (-not (Test-Path $mk)) { throw "装完仍找不到 makensis.exe（试过 $nsis）" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          Write-Output "NSIS: $nsis"
          & $mk /VERSION
      # PATH 必须在 Build QuaZip 之前配好：那一步的 cmake -G "MinGW Makefiles"
      # 要求 mingw32-make 已在 PATH 上，而 install-qt-action 的 addToolsToPath
      # 属于"别人帮我们做对的事"，靠它是运气，写明白是确定性。
      - name: environment configuration
        shell: pwsh
        run: |
          Write-Output "${{ env.QT_ROOT_DIR }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # 工具链目录名别写死（历史上叫过 mingw810_64 / mingw900_64，现在是 mingw1120_64）：
          # 把 Tools 下每个工具目录的 bin 都加进 PATH，install-qt-action 自带的那次
          # addToolsToPath 也是一样的 glob，这里只是双保险。
          Get-ChildItem "${{ env.QT_ROOT_DIR }}/../../Tools" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Output "$($_.FullName)/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Output "  工具链: $($_.Name)"
            }
      - name: where is qmake & where is mingw32-make & where is cmake
        shell: pwsh
        run: |
          Get-Command -Name 'qmake' | Format-List
          # -ErrorAction Stop：缺工具链要在这里就炸，别拖到后面报成"cmake 配置失败"
          Get-Command -Name 'mingw32-make' -ErrorAction Stop | Format-List
          Get-Command -Name 'g++' -ErrorAction Stop | Format-List
          Get-Command -Name 'cmake' -ErrorAction Stop | Format-List
      - name: Build QuaZip（必须自建，不能用 MSYS2 的）
        shell: pwsh
        env:
          # 这个 env 是本步曾经翻车的原因：pkg-config 自检在最后一行，
          # 没有 PKG_CONFIG_PATH 时它必然 exit 1，而 pwsh 会把"最后一条原生命令"
          # 的退出码当作整步的退出码 → 整步报红（quazip 其实已经编好了）。
          PKG_CONFIG_PATH: 'C:/msys64/mingw64/lib/pkgconfig;${{ github.workspace }}/quazip-install/lib/pkgconfig'
          QT_VER: ${{ matrix.qt_ver }}
        run: |
          # 未捕获的终止性错误 / throw 一律提升成 ::error:: 注解。
          # 理由同"收集并校验"那步：job 日志正文匿名读不到，annotations 可以读。
          # trap 必须放在脚本最前面才拦得住后面所有语句。
          trap { Write-Output "::error::$($_.Exception.Message)"; exit 1 }
          # 为什么不能 brew/pacman 拿现成 quazip：
          # MSYS2 的 libquazip1-qt6.dll 是针对 qt6-base 6.11 编的，导入表里有
          #   qt_version_tag_6_11 / QDir::mkpath(..., std::optional<QFlags<...>>)
          #   / QString::arg_impl(long long, int, int, QChar)
          # 而官方 Qt 6.7.2 的 Qt6Core.dll 只导出到 qt_version_tag_6_7
          # → 进程加载 libquazip1-qt6.dll 时会直接失败（DLL 里的依赖解析不了）。
          # 自建一份拿同一套 qmake/Qt 编，ABI 必然一致（.pro 用 pkg-config 找 quazip1-qt6）。
          #
          # ⚠️ pwsh 里原生命令非零退出**不会**中断脚本（$ErrorActionPreference
          # 只管 cmdlet）；Actions 最后只会拿"最后一条命令"的 $LASTEXITCODE 当整步退出码。
          # 所以每条原生命令后面都必须显式断言 —— 否则中间失败会被后面碰巧成功的
          # 命令掩盖，报错点会完全错到别的地方去。
          $ErrorActionPreference = 'Stop'
          function AssertOk([string]$what) {
            if ($LASTEXITCODE -ne 0) { throw "$what 失败（exit=$LASTEXITCODE）" }
          }

          iwr "https://github.com/stachenov/quazip/archive/refs/tags/v1.7.2.tar.gz" -OutFile quazip.tar.gz
          tar -xf quazip.tar.gz; AssertOk '解压 quazip 源码'
          if (-not (Test-Path quazip-1.7.2)) { throw 'quazip-1.7.2 目录不存在' }

          cmake -S quazip-1.7.2 -B quazip-build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" `
            -DZLIB_ROOT="C:/msys64/mingw64" `
            -DQUAZIP_QT_MAJOR_VERSION=6 `
            -DQUAZIP_ENABLE_QTEXTCODEC=OFF `
            -DQUAZIP_ENABLE_TESTS=OFF `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/quazip-install"
          AssertOk 'cmake configure'
          cmake --build quazip-build --parallel; AssertOk 'cmake build'
          cmake --install quazip-build; AssertOk 'cmake install'

          # Qt 官方包不带 Qt6Core.pc，pkg-config 解析不了生成的
          # "Requires: zlib, Qt6Core"；Qt 的 include/lib 本来由 qmake 提供，
          # 去掉这条 Requires 才能让 pkg-config --cflags/--libs 正常工作。
          $pc = "${{ github.workspace }}/quazip-install/lib/pkgconfig/quazip1-qt6.pc"
          if (-not (Test-Path $pc)) { throw "没有生成 $pc（cmake install 没落到 prefix？）" }
          (Get-Content $pc -Raw) -replace ', Qt6Core', '' | Set-Content $pc -NoNewline
          if ((Get-Content $pc -Raw) -match 'Qt6Core') { throw 'quazip1-qt6.pc 的 Requires 里仍有 Qt6Core' }
          Get-Content $pc

          # 确认 pkg-config 真能解析到它（不然 qmake 阶段会缺 quazip.h）
          # 必须写全路径：runner 的 PATH 上没有 MSYS2 的 bin（后面的 mingw-build
          # 之所以要把 pkg-config.exe 拷进 Qt/bin，就是因为同一件事）。
          C:/msys64/mingw64/bin/pkg-config.exe --modversion libaria2 quazip1-qt6
          AssertOk 'pkg-config 解析 libaria2/quazip1-qt6'

          # 自建的全部意义就是这个 ABI 标签 —— 必须显式核对，否则"自建"只是口号。
          # 期望值从 matrix 的 qt_ver 推出（6.7.2 → qt_version_tag_6_7）。
          $expected = 'qt_version_tag_' + ($env:QT_VER -replace '^(\d+)\.(\d+)\..*', '$1_$2')
          $objdump = (Get-ChildItem "${{ env.QT_ROOT_DIR }}/../../Tools" -Recurse `
            -Filter objdump.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $objdump) { throw 'objdump.exe 未找到：MinGW 工具链没装上？' }
          $dll = "${{ github.workspace }}/quazip-install/bin/libquazip1-qt6.dll"
          if (-not (Test-Path $dll)) { throw "没有生成 $dll" }
          $tags = @(& $objdump -p $dll | Select-String 'qt_version_tag_[0-9_]+' -AllMatches |
            ForEach-Object { $_.Matches.Value } | ForEach-Object { $_.TrimEnd('_') } | Sort-Object -Unique)
          Write-Output "自建 quazip 的 Qt ABI 标签: $($tags -join ', ')（期望 $expected，来自 Qt $env:QT_VER）"
          if ($tags -notcontains $expected) {
            throw "自建 quazip 的 ABI 标签与 Qt $env:QT_VER 不匹配：拿到的 $($tags -join ', ')"
          }
      - name: mingw-build
        id: build
        shell: pwsh
        env:
          # MSYS2 的 pkg-config 是原生程序，分隔符是 ';'（不是 ':'）。
          # quazip 用上一步自建的那份，libaria2/zlib 用 MSYS2 的。
          PKG_CONFIG_PATH: 'C:/msys64/mingw64/lib/pkgconfig;${{ github.workspace }}/quazip-install/lib/pkgconfig'
        run: |
          cp C:/msys64/mingw64/bin/pkg-config.exe ${{ env.QT_ROOT_DIR }}/bin/
          pkg-config --modversion libaria2 quazip1-qt6
          qmake
          mingw32-make.exe qmake_all
          mingw32-make.exe
      - name: package（windeployqt 铺 Qt 本体 + 插件）
        id: package
        shell: pwsh
        run: |
          trap { Write-Output "::error::$($_.Exception.Message)"; exit 1 }
          mkdir deploy
          mv release/modmanager.exe deploy
          # --no-compiler-runtime：MinGW 运行时（libgcc_s_seh-1 / libstdc++-6 /
          # libwinpthread-1）留给下一步统一从 MSYS2 取 —— libaria2 是 MSYS2 的新
          # GCC 编出来的，配它那一份最稳；下一步会做符号级校验，不会漏。
          # windeployqt.exe 就是 Qt6 的（QT_ROOT_DIR/bin 在 PATH 最前），
          # 官方 MinGW 包里没有 windeployqt6.exe 这个名字。
          windeployqt.exe --no-translations --no-opengl-sw --no-system-d3d-compiler --no-quick-import --no-compiler-runtime --qmldir "${{ env.QT_ROOT_DIR }}/qml" deploy/modmanager.exe
      - name: 收集并校验运行时 DLL（按导入表递归 + 符号级 ABI 校验）
        shell: pwsh
        env:
          # Windows 的 Python 在 stdout 被重定向（管道/文件）时按 ANSI 代码页编码，
          # 脚本里有中文 → 第一句 print 就 UnicodeEncodeError、traceback 直接 exit 1
          # （run #659 就是这么红的：只剩"exit code 1"，没有任何上下文）。
          # 脚本内已 reconfigure 成 UTF-8，这里再显式设一遍，双保险。
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          trap { Write-Output "::error::$($_.Exception.Message)"; exit 1 }
          # pwsh 解码原生命令的 stdout 用的是 [Console]::OutputEncoding；显式钉成 UTF-8，
          # 才能与上面 PYTHONUTF8 让 Python 输出的 UTF-8 对上 —— 否则中文在日志里变乱码，
          # 而"读得懂失败原因"恰恰是这步存在的意义。
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          # 手写一长串 cp 的做法已经废掉：上游改个 soname（libxml2-2 → libxml2-16、
          # libcares-5 → libcares-2）或换了 SSL 实现（libssl-1_1 → libssl-3）就会
          # 静默漏文件（Copy-Item 的报错是非终止性的，job 照样绿）。
          # package/collect-deploy-deps.py 直接按每个 PE 的导入表递归补齐，
          # 并逐个符号比对导出表，缺东西就 exit 1。
          #
          # 工具链 bin 不要"取 Tools 下的第一个目录"：那取决于装了什么、以及字母序，
          # 而脚本对不存在的 --search 目录是直接 [FATAL] 退出的。改成找含 objdump.exe 的那个。
          $toolsRoot = "$env:IQTA_TOOLS"
          if (-not $toolsRoot) { $toolsRoot = "${{ env.QT_ROOT_DIR }}/../../Tools" }
          $toolBin = (Get-ChildItem "$toolsRoot/*/bin/objdump.exe" -ErrorAction SilentlyContinue |
                      Select-Object -First 1).DirectoryName
          if (-not $toolBin) { throw "在 $toolsRoot 下找不到 objdump.exe（MinGW 工具链没装上？）" }
          Write-Output "工具链 bin: $toolBin"

          # 捕获全部输出：失败时既原样进日志，也提升成 ::error:: 注解。
          # 为什么必须做注解：job 日志正文经 API 要 admin 权限（匿名 403），
          # 而 check-run 的 annotations 是**匿名可读**的 —— 注解让下次失败无需凭据就能定位。
          $out = & python package/collect-deploy-deps.py --deploy deploy `
            --search C:/msys64/mingw64/bin `
            --search "${{ github.workspace }}/quazip-install/bin" `
            --search "${{ env.QT_ROOT_DIR }}/bin" `
            --search "$toolBin" `
            --json deploy-manifest.json 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Output "$_" }
          if ($code -ne 0) {
            $out | Select-String -Pattern '\[FAIL\]|\[FATAL\]|\[MISS\]|Traceback|Error' |
              Select-Object -First 12 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            Write-Output "::error::collect-deploy-deps.py 退出码 $code"
            exit 1
          }
      - name: 补 OpenSSL 3 的 provider 模块（运行时 LoadLibrary，PE 导入表里看不见）
        shell: pwsh
        run: |
          trap { Write-Output "::error::$($_.Exception.Message)"; exit 1 }
          # 为什么上一步的 collect-deploy-deps.py 抓不到它：
          # 它按"每个 PE 的导入表"递归补依赖，而 OpenSSL 3 的 provider 是
          # OSSL_PROVIDER_load() 在运行时才 LoadLibrary 的 —— 不出现在任何导入表里，
          # 所以静态分析必然漏掉。漏掉的后果不是"下载慢"，是 aria2::libraryInit()
          # 直接失败、启动即弹"下载功能可能不可用"，且主窗口被模态框挡住。
          # 详见 src/download/qaria2.cpp 里 ensureOpensslModulesPath() 的注释。
          $src = 'C:/msys64/mingw64/lib/ossl-modules'
          if (-not (Test-Path $src)) { throw "找不到 $src（MSYS2 的 openssl 变了布局？）" }
          $dst = 'deploy/ossl-modules'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src/*" $dst -Force
          # 必须是 legacy.dll 这一份：aria2 的 Platform::setUp() 加载的就是 legacy provider
          $legacy = Join-Path $dst 'legacy.dll'
          if (-not (Test-Path $legacy)) { throw "缺少 openssl legacy provider：$legacy" }
          Get-ChildItem $dst | ForEach-Object {
            Write-Output ("provider {0}  {1:N0} B" -f $_.Name, $_.Length)
          }
          # 程序是按 <exe 所在目录>/ossl-modules 找的，路径写死会漂
          if ($dst -ne 'deploy/ossl-modules') { throw 'provider 落点变了，qaria2.cpp 里的相对路径要同步改' }
      - name: Modify NSIS for x64
        shell: pwsh
        run: |
          (Get-Content package/modmanager.nsi).replace('PROGRAMFILES', 'PROGRAMFILES64') | Set-Content package/modmanager.nsi
      - name: Create installer
        shell: pwsh
        run: |
          trap { Write-Output "::error::$($_.Exception.Message)"; exit 1 }
          makensis package/modmanager.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis 失败（exit=$LASTEXITCODE）" }
          if (-not (Test-Path package/ModManager-Installer.exe)) { throw 'NSIS 没产出 ModManager-Installer.exe' }
          mv package/ModManager-Installer.exe ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-Installer.exe
          Compress-Archive -DestinationPath ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-packed.zip -Path deploy/*
          # 两个产物都必须真的落地：upload-artifact 找不到文件时默认只 warn 不报错
          # （if-no-files-found: warn），否则"打包失败"会以"绿 job + 没有附件"的形式溜过去。
          foreach ($f in @(
              "ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-Installer.exe",
              "ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-packed.zip")) {
            if (-not (Test-Path $f)) { throw "缺少产物 $f" }
            Write-Output ("产物 {0}  {1:N1} MiB" -f $f, ((Get-Item $f).Length / 1MB))
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-Installer.exe
          path: ${{github.workspace}}/ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-Installer.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-packed
          path: ${{github.workspace}}/ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-packed.zip
      - name: Upload Release
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-Installer.exe
          asset_name: ModManager-${{ env.VERSION }}-${{ matrix.qt_ver }}-x64-Installer.exe
          tag: ${{ github.ref }}
          overwrite: true
  build-on-osx:
    name: Build On OSX
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS-13 已于 2025-12-04 退役，写它会导致 job 直接调度失败。
        # 必须留在 Intel 镜像上：.pro 里 macx 段写的是 /usr/local 前缀，
        # 而 ARM64 镜像上 Homebrew 前缀是 /opt/homebrew；
        # 现有 libaria2 预编译包（clang-macos-13 产物）也是 x86_64。
        # macos-15-intel 是最后一个 Intel 镜像，官方支持到 2027-08。
        os: [macos-15-intel]
        qt_ver: [6.7.1]
        qt_arch: [clang_64]
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          host: 'mac'
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qt5compat'
      - name: Install libaria2
        run: |
          wget "https://github.com/kaniol-lck/aria2/releases/download/1.36.0/libaria2-libs-clang-macos-13-openssl-with-bt.zip"
          unzip *.zip
          csrutil status
          sudo cp -r lib/ /usr/local/lib/
          sudo cp -r include/ /usr/local/include/
          rm -rf lib/ include/ *.zip
      - name: Install dependencies
        run: |
          # quazip 不再走 brew：brew 的 quazip 是拿 brew 自己的 qt 编的，
          # 与本 job 用的官方 Qt 6.7.1 版本错配时，链接期就会缺
          # qt_version_tag_6_xx / 新加的 QtCore 符号。改为自建（见下一步）。
          brew install gnu-sed aria2 cmake
      - name: Build QuaZip（与官方 Qt 同 ABI）
        run: |
          curl -L -o quazip.tar.gz https://github.com/stachenov/quazip/archive/refs/tags/v1.7.2.tar.gz
          tar -xf quazip.tar.gz
          cmake -S quazip-1.7.2 -B quazip-build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                -DQUAZIP_QT_MAJOR_VERSION=6 \
                -DQUAZIP_ENABLE_QTEXTCODEC=OFF \
                -DQUAZIP_ENABLE_TESTS=OFF \
                -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build quazip-build --parallel 3
          sudo cmake --install quazip-build
          ls -l /usr/local/lib/libquazip1-qt6* /usr/local/include/QuaZip-Qt6-*/
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set Env
        shell: bash
        run: |
          export RAW_VERSION=$(grep -o '".*"' src/version.h | sed 's/"//g')
          export VERSION=$RAW_VERSION-build.$GITHUB_RUN_NUMBER
          echo "RAW_VERSION=${RAW_VERSION}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Modify version number
        if: ${{ !startsWith(github.event.ref, 'refs/tags/') }}
        shell: bash
        run: |
          gsed -i "s/$RAW_VERSION/$VERSION/" src/version.h
      - name: build macos
        run: |
          qmake
          make
      - name: package
        run: |
          # OpenSSL 3 的 provider（legacy）是运行时 dlopen 的独立模块，macdeployqt 只按
          # dylib 依赖收集、看不见它。缺了就是与 Windows 同一个症状：aria2::libraryInit()
          # 失败 → 启动即弹"下载功能可能不可用"，且主窗口被模态框挡住。
          OSSL="$(brew --prefix openssl@3)/lib/ossl-modules"
          [ -d "$OSSL" ] || { echo "::error::找不到 $OSSL（brew 的 openssl@3 没装？）"; exit 1; }
          mkdir -p modmanager.app/Contents/MacOS/ossl-modules
          cp "$OSSL"/*.dylib modmanager.app/Contents/MacOS/ossl-modules/
          # 光复制不够：provider 自己仍依赖 Homebrew 的绝对路径（/usr/local/opt/openssl@3/...），
          # 用户机器上没装 brew 就 dlopen 失败。改成指向 bundle 内的 Frameworks
          # （@executable_path 恒为 Contents/MacOS，与 provider 放在哪个子目录无关）。
          for f in modmanager.app/Contents/MacOS/ossl-modules/*.dylib; do
            otool -L "$f" | awk 'NR > 1 { print $1 }' | grep '^/usr/local/' | while read -r dep; do
              install_name_tool -change "$dep" \
                "@executable_path/../Frameworks/$(basename "$dep")" "$f"
            done
          done
          # 断言：不许再有指向 /usr/local 的依赖残留（否则这个修复只是"看起来做了"）
          if otool -L modmanager.app/Contents/MacOS/ossl-modules/*.dylib | grep -qE '^\s*/usr/local/'; then
            echo "::error::provider 仍依赖 Homebrew 绝对路径，用户机器上会 dlopen 失败"
            otool -L modmanager.app/Contents/MacOS/ossl-modules/*.dylib
            exit 1
          fi
          ls -l modmanager.app/Contents/MacOS/ossl-modules/
          # 失败也要能被远程读到：注解匿名可读，job 日志正文要 admin。
          set +e
          macdeployqt modmanager.app -qmldir=. -verbose=1 -dmg > mdq.log 2>&1; MDQ=$?
          set -e
          tail -30 mdq.log
          if [ "$MDQ" -ne 0 ]; then
            grep -aE 'ERROR|error:|failed' mdq.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::macdeployqt 失败（exit=$MDQ）"
            exit 1
          fi
          [ -f modmanager.dmg ] || { echo "::error::没产出 modmanager.dmg"; exit 1; }
          mv modmanager.dmg ModManager-${{ env.VERSION }}.dmg
        shell: sh
      - uses: actions/upload-artifact@v4
        with:
          name: ModManager-${{ env.VERSION }}.dmg
          path: ModManager-${{ env.VERSION }}.dmg
      - name: uploadRelease
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ModManager-${{ env.VERSION }}.dmg
          asset_name: ModManager-${{ env.VERSION }}.dmg
          tag: ${{ github.ref }}
          overwrite: true
